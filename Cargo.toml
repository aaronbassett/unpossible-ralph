[package]
name = "ralph"
version = "0.1.0"
edition = "2021"
description = "AI coding agent loop orchestrator with intelligent verification"
license = "MIT"
repository = "https://github.com/unpossible/unpossible-ralph"
readme = "README.md"
keywords = ["ai", "agent", "orchestration", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Configuration parsing
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# Async runtime for process management
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# RESULT signal parsing
regex = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
strip = true
